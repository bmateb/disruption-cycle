<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="color-scheme" content="light dark"><title>Disruption Cycle: Capital Markets</title><style>:root{
  --bg:#EDF0EB; --surface:#FFFFFF; --sunk:#E4E9E3; --ink:#14201B; --ink2:#46534C; --ink3:#6E7B74; --line:#CED6CF;
  --brand:#0E4B41; --brand-ink:#FFFFFF; --brand-soft:#D7E8E3;
  --h1:#2a78d6; --h2:#eb6834; --h3:#1baf7a; --h1t:#1c5cab; --h2t:#b94312; --h3t:#0d7a53;
  --good:#1E7B4A; --warn:#9A5B00; --bad:#B3261E; --good-bg:#DDF0E4; --warn-bg:#F7E8CC; --bad-bg:#F6DAD7;
  --ff-display:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;
  --ff-body:'IBM Plex Sans','Segoe UI',system-ui,sans-serif;
  --ff-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#101614; --surface:#18201D; --sunk:#222C28; --ink:#E8EFEA; --ink2:#B7C3BC; --ink3:#88958E; --line:#2E3A35;
    --brand:#4DBBA3; --brand-ink:#07211B; --brand-soft:#1B3A33;
    --h1:#3987e5; --h2:#d95926; --h3:#199e70; --h1t:#7DB2F0; --h2t:#F09A74; --h3t:#5CCBA1;
    --good:#5CCB8E; --warn:#E5B35C; --bad:#F0877F; --good-bg:#173626; --warn-bg:#3A2D12; --bad-bg:#3E1D1A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#101614; --surface:#18201D; --sunk:#222C28; --ink:#E8EFEA; --ink2:#B7C3BC; --ink3:#88958E; --line:#2E3A35;
  --brand:#4DBBA3; --brand-ink:#07211B; --brand-soft:#1B3A33;
  --h1:#3987e5; --h2:#d95926; --h3:#199e70; --h1t:#7DB2F0; --h2t:#F09A74; --h3t:#5CCBA1;
  --good:#5CCB8E; --warn:#E5B35C; --bad:#F0877F; --good-bg:#173626; --warn-bg:#3A2D12; --bad-bg:#3E1D1A; color-scheme:dark;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--ff-body);margin:0;min-height:100vh}
h1,h2,h3,h4{font-family:var(--ff-display);margin:0;letter-spacing:-.01em;text-wrap:balance}
h1{font-size:clamp(26px,5vw,40px);font-weight:800;line-height:1.05}
h2{font-size:18px;font-weight:700} h3{font-size:14px;font-weight:700}
p{margin:0 0 .6em}
button{font:inherit;cursor:pointer;color:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.mono,.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--ff-mono)}
.eyebrow{font:500 11px/1 var(--ff-mono);text-transform:uppercase;letter-spacing:.09em;color:var(--ink3)}
.muted{color:var(--ink2)} .faint{color:var(--ink3)} .small{font-size:12.5px}
.up{color:var(--good)} .dn{color:var(--bad)} .wn{color:var(--warn)}
.hide{display:none!important}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}

/* buttons */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 14px;font-weight:600;min-height:40px}
.btn:hover{border-color:var(--ink3)}
.btn.pri{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.pri:disabled{opacity:.45;cursor:not-allowed}
.btn.sell{background:var(--bad);color:#fff;border-color:var(--bad)}
.btn.sm{padding:4px 10px;min-height:30px;font-size:13px}
.btn.on{background:var(--brand-soft);border-color:var(--brand);color:var(--ink)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font:500 11px/18px var(--ff-mono);background:var(--sunk);color:var(--ink2);white-space:nowrap}
.hd{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px}
.h1c{background:var(--h1)} .h2c{background:var(--h2)} .h3c{background:var(--h3)}
.chip.good{background:var(--good-bg);color:var(--good)} .chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.warn{background:var(--warn-bg);color:var(--warn)}

/* landing + forms */
.landing{display:grid;place-items:center;min-height:100vh;padding:24px 16px}
.hero{max-width:560px;width:100%}
.hero h1{margin:10px 0 8px}
.cardrow{display:grid;gap:12px;margin-top:22px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.card h3{margin-bottom:6px}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font:500 12px/1 var(--ff-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--ink3)}
.field input,.field select{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-height:40px;width:100%}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.err{color:var(--bad);font-size:13px}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;gap:14px;align-items:center;padding-top:8px;padding-bottom:8px;flex-wrap:wrap}
.brand{font:800 16px var(--ff-display)} .brand small{display:block;font:500 10px var(--ff-mono);color:var(--ink3);letter-spacing:.08em;text-transform:uppercase}
.kpi{display:grid;gap:1px;min-width:74px}
.kpi b{font:600 16px var(--ff-mono)} .kpi span{font:500 10.5px var(--ff-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.spacer{flex:1}
.clock{display:grid;gap:3px;min-width:150px}
.clock .bar{height:6px;background:var(--sunk);border-radius:4px;overflow:hidden}
.clock .bar i{display:block;height:100%;background:var(--brand);transition:width .4s linear}
.conn{width:9px;height:9px;border-radius:50%;background:var(--warn);display:inline-block}
.conn.ok{background:var(--good)} .conn.bad{background:var(--bad)}
.tabs{display:flex;gap:2px;overflow-x:auto}
.tab{border:0;background:none;padding:10px 14px;font-weight:600;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--brand)}

/* layout */
.main{padding:14px 0 90px}
.cols{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px;align-items:start}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.panel>h2,.panel>.ph{padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
.panel .pb{padding:12px 14px}
table{border-collapse:collapse;width:100%}
th{font:500 10.5px/1.2 var(--ff-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3);text-align:right;padding:8px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th:first-child,td:first-child{text-align:left}
td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;vertical-align:middle}
tr:last-child td{border-bottom:0}
tr.mk{cursor:pointer} tr.mk:hover td{background:var(--sunk)} tr.mk.sel td{background:var(--brand-soft)}
tr.dead td{opacity:.55}
.pn{display:block;font-weight:700} .ps{display:block;font-size:12px;color:var(--ink3);font-weight:400}
.flowbar{display:inline-block;height:6px;border-radius:3px;vertical-align:middle;margin-left:6px;min-width:1px}
.big table td{padding:11px 10px;font-size:16px} .big .pn{font-size:16px} .big th{font-size:12px}

/* detail */
.facts{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:10px 0}
.fact{background:var(--bg);border-radius:8px;padding:8px 10px}
.fact span{display:block;font:500 10.5px var(--ff-mono);text-transform:uppercase;letter-spacing:.07em;color:var(--ink3)}
.fact b{font:600 15px var(--ff-mono)}
.meter{height:8px;background:var(--sunk);border-radius:4px;overflow:hidden;margin-top:6px}
.meter i{display:block;height:100%;background:var(--good)}
.meter.low i{background:var(--bad)} .meter.mid i{background:var(--warn)}
.ticket{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:7px 16px;font-weight:700}
.seg button.on.buy{background:var(--good);color:#fff} .seg button.on.sell{background:var(--bad);color:#fff}
.amts{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.quote{display:grid;grid-template-columns:1fr auto;gap:2px 12px;font-size:13px;margin:8px 0}
.quote span:nth-child(odd){color:var(--ink3)} .quote span:nth-child(even){text-align:right;font-family:var(--ff-mono)}
.note{background:var(--sunk);border-radius:8px;padding:8px 10px;font-size:13px;color:var(--ink2);margin:8px 0}
.note.warn{background:var(--warn-bg);color:var(--warn)}
.slider{width:100%}
svg.ch{width:100%;height:auto;display:block}
.feed{max-height:340px;overflow:auto}
.feed div{padding:7px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.feed div:last-child{border:0}
.feed .t{font:500 11px var(--ff-mono);color:var(--ink3);margin-right:8px}
.bar-stack{display:flex;height:22px;border-radius:6px;overflow:hidden;background:var(--sunk)}
.bar-stack i{display:block;height:100%}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--ink2);margin-top:6px}
.toast{position:fixed;left:50%;bottom:76px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:10px;font-weight:600;z-index:60;max-width:90vw;box-shadow:0 6px 24px rgba(0,0,0,.25)}
.toast.bad{background:var(--bad);color:#fff}
.bottom{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);display:none;z-index:30}
.bottom button{flex:1;border:0;background:none;padding:10px 4px 12px;font-weight:600;color:var(--ink3);font-size:12px}
.bottom button.on{color:var(--brand)}
.overlay{position:fixed;inset:0;background:var(--bg);z-index:40;overflow:auto;padding:0 0 90px}
.qr{background:#fff;padding:10px;border-radius:10px;display:inline-block;line-height:0}
.code{font:700 34px var(--ff-mono);letter-spacing:.14em}
.users{display:flex;flex-wrap:wrap;gap:6px}
.pill{background:var(--sunk);border-radius:999px;padding:3px 10px;font-size:12.5px}
.pill.off{opacity:.45}
.tbl-sm td,.tbl-sm th{padding:6px 8px;font-size:13px}
.amber td{background:var(--warn-bg)}
@media (max-width:900px){
  .cols{grid-template-columns:1fr}
  .bottom{display:flex}
  .tabs.deskonly{display:none}
  .hm{display:none}
  .facts{grid-template-columns:repeat(2,1fr)}
  .top .wrap{gap:8px}
  .kpi b{font-size:14px}
  .kpi{min-width:60px}
  .main{padding-top:10px}
  td{padding:9px 5px}
}
@media (min-width:901px){ .only-m{display:none!important} }

/* v2: live prices, candles, news ticker, practice, results */
.chg{font:600 12.5px var(--ff-mono);white-space:nowrap;color:var(--ink3)}
.chg.up{color:var(--good)} .chg.dn{color:var(--bad)}
.chg .chp{font-weight:500;opacity:.85}
td.pxc,.bigpx{border-radius:6px}
td.pxc.fu,.bigpx.fu{animation:flu 1s ease-out} td.pxc.fd,.bigpx.fd{animation:fld 1s ease-out}
@keyframes flu{0%{background:rgba(30,123,74,.22)}100%{background:transparent}}
@keyframes fld{0%{background:rgba(179,38,30,.22)}100%{background:transparent}}
.bigpx{font-size:28px;padding:0 4px}
.mt td{padding:10px 8px} .mt .chg{font-size:12px}
.nochart{display:grid;place-items:center;background:var(--bg);border-radius:8px;color:var(--ink3);font-size:13px;margin:8px 0}
.seg.tf button{padding:5px 11px;font-size:12.5px;font-weight:600}
.seg.tf button.on{background:var(--brand);color:var(--brand-ink)}
.tick{display:grid;gap:0;margin:6px auto 0;border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden}
.ti{display:flex;gap:10px;align-items:baseline;padding:5px 12px;font-size:13.5px;border-bottom:1px solid var(--line);color:var(--ink2);cursor:default}
.ti:last-child{border-bottom:0}
.ti[data-act]{cursor:pointer}
.ti .t{font:600 10.5px var(--ff-mono);color:var(--ink3);min-width:34px;letter-spacing:.06em}
.ti.new{color:var(--ink);font-weight:700;background:var(--brand-soft);animation:newsin .5s ease-out}
.ti.new .t{color:var(--brand)}
@keyframes newsin{0%{transform:translateY(-8px);opacity:0}100%{transform:none;opacity:1}}
.feed .nl{cursor:pointer} .feed .nl:hover{background:var(--sunk)}
.prac{display:flex;gap:12px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-top:8px;padding:10px 14px;border-radius:10px;background:var(--warn-bg);color:var(--ink);border:1px solid var(--warn)}
.steps{margin:0 0 10px;padding-left:20px;display:grid;gap:8px}
.gloss{display:grid;gap:8px} .gl{display:grid;gap:1px} .gl b{font-size:13.5px} .gl span{font-size:13px;color:var(--ink2)}
.pill.rdy{background:var(--good-bg);color:var(--good);font-weight:600}
.podium{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pod{background:var(--bg);border-radius:12px;padding:12px;display:grid;gap:2px;justify-items:center;text-align:center;border:1px solid var(--line)}
.pod.p0{border-color:var(--warn);background:var(--warn-bg)} .pod .pm{font-size:26px}
.rt td{padding:8px 8px} .rr{cursor:pointer} .rr:hover td{background:var(--sunk)} .rr.me td{background:var(--brand-soft);font-weight:600}
.rt .chev{width:22px;text-align:center;color:var(--ink3)}
.rd>td{background:var(--bg);padding:6px 10px 12px} .rd .tbl-sm tr.tot td{border-top:2px solid var(--line)}
.kpi .kc{text-transform:none;letter-spacing:0}
@media (max-width:560px){.podium{grid-template-columns:1fr}.bigpx{font-size:24px}.ti{font-size:12.5px;padding:4px 10px}}

.nw{white-space:nowrap}

/* v3: spacing, mobile navigation, stacked mobile numbers */
.panel .ph{padding:12px 16px;display:flex;align-items:flex-start;gap:10px;border-bottom:1px solid var(--line)}
.panel>h2{padding:12px 16px}
.panel .pb{padding:14px 16px}
.panel>table th:first-child,.panel>table td:first-child,.panel>div>table:not(.rt):not(.tbl-sm) th:first-child,.panel>div>table:not(.rt):not(.tbl-sm) td:first-child{padding-left:16px}
.panel>table th:last-child,.panel>table td:last-child,.panel>div>table:not(.rt):not(.tbl-sm) th:last-child,.panel>div>table:not(.rt):not(.tbl-sm) td:last-child{padding-right:16px}
.card{padding:14px 16px}
.fact{padding:10px 12px}
.note{padding:10px 12px}
.prac{padding:12px 16px}
.ti{padding:6px 14px}
.feed div{padding:8px 0}
.prac.plan{background:var(--brand-soft);border-color:var(--brand)}
.bottom button i{display:block;font-style:normal;font-size:18px;line-height:1.2;margin-bottom:1px}
@media (max-width:900px){
  .bottom{display:flex;z-index:70;background:var(--brand);border-top:0;box-shadow:0 -4px 18px rgba(0,0,0,.28);padding-bottom:env(safe-area-inset-bottom)}
  .bottom button{color:rgba(255,255,255,.72);font-weight:700;font-size:11.5px;padding:8px 2px 9px;border-radius:0;position:relative}
  .bottom button.on{color:#fff;background:rgba(255,255,255,.16)}
  .bottom button.on::before{content:"";position:absolute;left:18%;right:18%;top:0;height:3px;border-radius:0 0 3px 3px;background:#fff}
  :root[data-theme="dark"] .bottom,:root:not([data-theme="light"]) .bottom{}
  .main{padding-bottom:96px}
  .wrap{padding:0 12px}
  .panel .pb{padding:12px 14px}
  .panel>h2,.panel .ph{padding:11px 14px}
  .panel>table th:first-child,.panel>table td:first-child,.panel>div>table:not(.rt):not(.tbl-sm) th:first-child,.panel>div>table:not(.rt):not(.tbl-sm) td:first-child{padding-left:14px}
  .panel>table th:last-child,.panel>table td:last-child,.panel>div>table:not(.rt):not(.tbl-sm) th:last-child,.panel>div>table:not(.rt):not(.tbl-sm) td:last-child{padding-right:14px}
  .chg{font-size:11.5px;line-height:1.25} .chg .chp{display:block}
  .mt td,td{padding:9px 4px} th{padding:8px 4px;font-size:9.5px;letter-spacing:.04em}
  .mt .pn{font-size:14px}
  .bigpx{font-size:24px}
  .top .wrap{padding-top:6px;padding-bottom:6px}
  .toast{bottom:84px}
  .rt td{padding:8px 4px} .tbl-sm td,.tbl-sm th{padding:6px 4px}
  .podium{gap:8px}
}

@media (max-width:560px){.top .wrap{flex-wrap:nowrap;gap:10px}.top .brand{display:none}.clock{min-width:0;flex:1}.kpi{min-width:0}}

/* v5: major-news dropdown */
.ann{margin-top:8px;border:2px solid var(--brand);border-radius:12px;background:var(--surface);overflow:hidden;box-shadow:0 6px 20px rgba(0,0,0,.14)}
@keyframes annin{0%{transform:translateY(-10px);opacity:0}100%{transform:none;opacity:1}}
.annh{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;border:0;background:var(--brand);color:var(--brand-ink);padding:10px 14px;font-size:14px;text-align:left}
.annb{padding:8px 14px 12px}
.ai{display:flex;gap:10px;align-items:baseline;padding:8px 0;border-bottom:1px solid var(--line);font-size:14.5px;font-weight:600}
.ai[data-act]{cursor:pointer} .ai i{font-style:normal;font-weight:800;width:18px;text-align:center}
.ai.ok i{color:var(--good)} .ai.bad i{color:var(--bad)} .ai.mkt i{color:var(--warn)}
.ai.ok{background:linear-gradient(90deg,var(--good-bg),transparent 60%)} .ai.bad{background:linear-gradient(90deg,var(--bad-bg),transparent 60%)} .ai.mkt{background:linear-gradient(90deg,var(--warn-bg),transparent 60%)}

/* v6: reconnect + join QR modal */
.conn-warn{display:flex;gap:10px;align-items:center;justify-content:space-between;margin-top:8px;font-weight:600}
.conn[title="Tap to reconnect"]{width:14px;height:14px;box-shadow:0 0 0 4px var(--sunk)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;display:grid;place-items:center;padding:16px}
.mbox{background:var(--surface);border-radius:16px;padding:22px 26px;text-align:center;max-width:520px;width:100%;display:grid;gap:8px;justify-items:center}
.qr.big svg{width:min(70vw,360px);height:auto}

/* v6.1: no replaying animation on the per-second dropdown; keep content clear of the mobile nav */
@media (max-width:900px){ main.wrap.main{padding-bottom:calc(110px + env(safe-area-inset-bottom))} }
/* v6.2: breathing room between stacked tiles on mobile */
@media (max-width:900px){ #cbody>*+*,#hbody>*+*{margin-top:12px} #ticker+main.wrap.main,#banner+#ticker+main.wrap.main{padding-top:12px} #cbody .panel+.panel,#cbody .card+.card{margin-top:12px} }

/* v7: bonds and index */
.fihd{padding:10px 14px 6px;font-weight:700;border-top:1px solid var(--line);background:var(--sunk)}
table.fit{margin-top:0}

/* v8: price announcer and market board */
.mq{background:#0b1511;color:#d9e6de;overflow:hidden;white-space:nowrap;height:26px;line-height:26px;font:600 12px var(--ff-mono, monospace);border-bottom:1px solid #000}
.mqt{display:inline-block;animation:mqs 80s linear infinite;will-change:transform}
.mq:hover .mqt{animation-play-state:paused}
@keyframes mqs{to{transform:translateX(-50%)}}
.tp{margin:0 20px}.tp b{color:#fff}.tp .v{color:#fff}.tp .c.u{color:#4ade80}.tp .c.d{color:#f87171}
@media (prefers-reduced-motion:reduce){.mq{overflow-x:auto}.mqt{animation:none}}
.mgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px}
.mcard{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:10px 12px;cursor:pointer;display:grid;gap:4px}
.mcard:hover{border-color:var(--brand);box-shadow:0 2px 10px rgba(0,0,0,.1)}

/* transport: MQTT over WebSocket through a free public broker, or BroadcastChannel for same-browser rehearsal */
const BROKERS = [
  { n: 'EMQX public', u: 'wss://broker.emqx.io:8084/mqtt' },
  { n: 'HiveMQ public', u: 'wss://broker.hivemq.com:8884/mqtt' },
  { n: 'Mosquitto test', u: 'wss://test.mosquitto.org:8081' },

const NS = 'dcap1/';
function rid(n) { const c = 'abcdefghjkmnpqrstuvwxyz23456789'; let s = ''; const a = new Uint8Array(n); (crypto || msCrypto).getRandomValues(a); for (const b of a) s += c[b % c.length]; return s; }

function netOpen(o) { // {url, room, subs, onMsg(topic,obj), onState(state,detail)}
  const base = NS + o.room + '/';
  if (o.url === 'local') {
    const ch = new BroadcastChannel('dcap-' + o.room); const subs = new Set(o.subs);
    ch.onmessage = e => { const d = e.data; if (subs.has(d.t)) o.onMsg(d.t, d.m); };
    setTimeout(() => o.onState('up'), 0);
    return { send: (t, m) => ch.postMessage({ t, m: JSON.parse(JSON.stringify(m)) }), close: () => ch.close(), url: 'local' };
  }
  const c = mqtt.connect(o.url, { clientId: 'dc' + rid(10), clean: true, keepalive: 25, reconnectPeriod: 1500, connectTimeout: 9000, resubscribe: true });
  c.on('connect', () => { c.subscribe(o.subs.map(t => base + t), { qos: 0 }, err => { if (err) o.onState('err', String(err)); else o.onState('up'); }); });
  c.on('close', () => o.onState('down'));
  c.on('offline', () => o.onState('down'));
  c.on('error', e => o.onState('err', e && e.message));
  c.on('message', (t, m) => { try { o.onMsg(t.slice(base.length), JSON.parse(m.toString())); } catch (e) { } });
  return { send: (t, m, qos) => { if (c.connected) c.publish(base + t, JSON.stringify(m), { qos: qos || 0 }); }, close: () => c.end(true), url: o.url, client: c };
}

function brokerTest(url, ms) { // resolves {ok, rtt}
  return new Promise(res => {
    if (url === 'local') return res({ ok: true, rtt: 0 });
    let done = false, c; const t0 = performance.now();
    const fin = r => { if (done) return; done = true; try { c && c.end(true); } catch (e) { } res(r); };
    try {
      c = mqtt.connect(url, { clientId: 'dct' + rid(8), clean: true, reconnectPeriod: 0, connectTimeout: ms || 7000 });
      const topic = NS + 'test/' + rid(8);
      c.on('connect', () => c.subscribe(topic, { qos: 0 }, err => { if (err) return fin({ ok: false, err: String(err) }); c.publish(topic, 'x', { qos: 0 }); }));
      c.on('message', () => fin({ ok: true, rtt: Math.round(performance.now() - t0) }));
      c.on('error', e => fin({ ok: false, err: e && e.message || 'error' }));
      setTimeout(() => fin({ ok: false, err: 'timeout' }), (ms || 7000) + 1500);

}
function brokerUrl(P) { // from hash params

function hostOnMsg(t, m) {

function pracNew() { return { cash: C.tk ? C.tk.cash0 : 100000, hold: new Array(DC.NA).fill(0), cost: new Array(DC.NA).fill(0), z: new Array(DC.NA).fill(0), dd: {}, tr: 0 }; }
function pracPriv() { const p = C.prac; return { id: C.me.id, name: C.me.name, cash: p.cash, hold: p.hold, cost: p.cost, dd: p.dd, nw: 0, tr: p.tr, ack: null, nwc: [], rdy: C.rdy ? 1 : 0, rank: 1, n: 1 }; }
function pracAct(a) {

  } else if (a.k === 'b') {

    p.cash -= cost; p.hold[i] += a.s; p.cost[i] += cost; p.z[i] += x / q.D; p.tr++; ack = { ok: true, k: 'b', p: i, S: a.s, x: Math.round(x) };
  } else if (a.k === 's') {
